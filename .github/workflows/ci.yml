name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Swift version
        run: swift --version
      - name: Test (default traits)
        run: swift test
      - name: Build with all traits (Box and pCloud backends)
        run: swift build --enable-all-traits

  thread-sanitizer:
    name: Thread Sanitizer
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      # The concurrency suites assert that reading a Store while another thread writes it is
      # safe. That holds today only because Map and FileZone keep no unguarded mutable state,
      # which Store does not promise (AUDIT.md item 9). They fail without a sanitizer too, on
      # a crash or a wrong answer, but under TSan they fail on the race itself rather than
      # waiting for it to show.
      - name: Test concurrency suites under Thread Sanitizer
        run: swift test --sanitize=thread --filter 'ConcurrencyTests'
